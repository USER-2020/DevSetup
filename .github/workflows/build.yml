name: Build installers
on: { workflow_dispatch: {}, workflow_call: {}, push: { branches: [main] } }
jobs:
  build:
    strategy: { matrix: { os: [windows-latest, macos-13, macos-14] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: devsetup-${{ matrix.os }}, path: release/* }
