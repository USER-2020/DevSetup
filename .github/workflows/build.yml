name: Build installers

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is intentionally excluded: its hosted runner can remain
        # queued indefinitely, blocking the installer workflow.
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: devsetup-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
